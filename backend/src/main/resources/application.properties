server.port=8080

spring.application.name=backend

# Default active profile (mysql for production database)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Common JWT Configuration
jwt.secret=mySecretKeyForGymBucketApplicationThatIsAtLeast64CharactersLongForHS512Security
jwt.expirationMs=3600000
jwt.refreshExpirationMs=604800000

# Frontend URL
app.frontend.url=http://localhost:4200

# Email Configuration (for future email verification)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.gym.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway (enabled globally; DB-specific props live in profile files)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl